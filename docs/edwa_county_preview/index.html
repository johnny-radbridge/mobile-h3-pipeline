                            setGeography(geography.id);
                        });
                        geographyToggle.appendChild(button);
                    });
                }

                var yearToggle = document.getElementById("edwa-year-toggle");
                years.forEach(function(year) {
                    var button = document.createElement("button");
                    button.type = "button";
                    button.className = "edwa-year-btn" + (year.id === activeYear() ? " edwa-active" : "");
                    button.dataset.yearId = year.id;
                    button.textContent = year.label;
                    button.addEventListener("click", function() {
                        setYear(year.id);
                    });
                    yearToggle.appendChild(button);
                });

                var selectAllBtn = document.getElementById("edwa-layer-select-all");
                var clearAllBtn = document.getElementById("edwa-layer-clear-all");
                var featuredHost = document.getElementById("edwa-featured-layers");
                if (featuredHost) {
                    Array.prototype.slice.call(section.querySelectorAll("label")).forEach(function(label) {
                        if (/all recreation/i.test((label.textContent || "").trim())) {
                            featuredHost.appendChild(label);
                        }
                    });
                }
                function activityInputs() {
                    return overlayInputs(section);
                }
                function featuredInputs() {
                    return featuredHost
                        ? overlayInputs(featuredHost)
                        : [];
                }
                function allInputs() {
                    return featuredInputs().concat(activityInputs());
                }
                function setInputsChecked(inputs, on) {
                    inputs.forEach(function(input) {
                        if (input.checked !== on) input.click();
                    });
                }
                if (!window.edwaOriginInitializedDefaultLayers && featuredInputs().length) {
                    setInputsChecked(activityInputs().filter(function(input) { return input.checked; }), false);
                    setInputsChecked(featuredInputs(), true);
                    window.edwaOriginInitializedDefaultLayers = true;
                }
                selectAllBtn.addEventListener("click", function(ev) {
                    ev.preventDefault();
                    setInputsChecked(allInputs(), true);
                });
                clearAllBtn.addEventListener("click", function(ev) {
                    ev.preventDefault();
                    setInputsChecked(allInputs().filter(function(input) { return input.checked; }), false);
                });
                syncYearButtons(activeYear());
            }

            window.edwaOriginActiveYear = window.edwaOriginActiveYear || defaultYear;
            window.edwaOriginActiveGeography = window.edwaOriginActiveGeography || defaultGeography;
            window.edwaOriginSetYear = setYear;
            window.edwaOriginSetGeography = setGeography;
            layers.forEach(function(meta) {
                meta.groupLayer = window[meta.groupVar];
            });
            mapRef.on("overlayadd", function(e) {
                var meta = layers.find(function(m) { return m.groupLayer === e.layer; });
                if (!meta) return;
                loadLayer(meta).catch(function(err) {
                    console.error("Year choropleth load failed:", meta.id, err);
                });
            });
            mapRef.on("overlayremove", function(e) {
                var meta = layers.find(function(m) { return m.groupLayer === e.layer; });
                if (!meta) return;
                detachYearLayers(meta);
            });
            document.addEventListener("DOMContentLoaded", function() {
                installControlCollapse();
                installPanel();
                setTimeout(installControlCollapse, 300);
                setTimeout(installPanel, 300);
                setTimeout(installControlCollapse, 800);
                setTimeout(installPanel, 800);
            });
            mapRef.whenReady(function() {
                installControlCollapse();
                installPanel();
                syncYearButtons(activeYear());
                syncGeographyButtons(activeGeography());
                refreshVisibleLayers();
            });
        })();
        
</script>
</html>
