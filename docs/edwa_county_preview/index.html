            }
            function normalizedT(meta, value) {
                if (!isFinite(value)) {
                    value = meta.vmin != null ? meta.vmin : 0;
                }
                var lo = meta.vmin, hi = meta.vmax;
                if (hi <= lo) {
                    return 0;
                }
                return Math.max(0, Math.min(1, (value - lo) / (hi - lo)));
            }
            function styleFor(meta) {
                return function(feature) {
                    var value = Number(feature.properties[meta.valueField]);
                    return {
                        fillColor: mixHex(meta.colors, normalizedT(meta, value)),
                        color: STROKE.color,
                        weight: STROKE.weight,
                        opacity: STROKE.opacity,
                        fillOpacity: STROKE.fillOpacity,
                    };
                };
            }
            function highlightStyle() {
                return HIGHLIGHT;
            }
            function tooltipFor(meta) {
                return function(feature, layer) {
                    var p = feature.properties || {};
                    var lines = [];
                    meta.tooltipFields.forEach(function(field, i) {
                        var label = meta.tooltipAliases[i] || field;
                        var val = p[field];
                        if (val !== undefined && val !== null && String(val).trim() !== "") {
                            lines.push("<b>" + label + ":</b> " + val);
                        }
                    });
                    if (lines.length) {
                        layer.bindTooltip(lines.join("<br>"), {
                            sticky: true,
                            direction: "top",
                            opacity: 0.96,
                        });
                    }
                };
            }
            function activeYear() {
                return window.edwaOriginActiveYear || defaultYear;
            }
            function detachYearLayers(meta) {
                var byYear = geoLayers[meta.id];
                if (!byYear || !meta.groupLayer) return;
                Object.keys(byYear).forEach(function(yearId) {
                    var gj = byYear[yearId];
                    if (gj && meta.groupLayer.hasLayer(gj)) {
                        meta.groupLayer.removeLayer(gj);
                    }
                });
            }
            function ensureLayerCache(meta) {
                if (!geoLayers[meta.id]) {
                    geoLayers[meta.id] = {};
                }
                return geoLayers[meta.id];
            }
            function loadLayer(meta) {
                var yearId = activeYear();
                var yearUrl = meta.yearUrls ? meta.yearUrls[yearId] : null;
                detachYearLayers(meta);
                if (!yearUrl || !meta.groupLayer || !mapRef.hasLayer(meta.groupLayer)) {
                    return Promise.resolve();
                }
                var cache = ensureLayerCache(meta);
                var cached = cache[yearId];
                if (cached) {
                    cached.addTo(meta.groupLayer);
                    return Promise.resolve();
                }
                return fetch(yearUrl).then(function(r) {
                    if (!r.ok) throw new Error("Failed to load " + yearUrl);
                    return r.json();
                }).then(function(data) {
                    var gj = L.geoJSON(data, {
                        style: styleFor(meta),
                        highlightFunction: highlightStyle,
                        onEachFeature: tooltipFor(meta),
                    });
                    cache[yearId] = gj;
                    if (meta.groupLayer && mapRef.hasLayer(meta.groupLayer)) {
                        gj.addTo(meta.groupLayer);
                    }
                });
            }
            function refreshVisibleLayers() {
                layers.forEach(function(meta) {
                    if (meta.groupLayer && mapRef.hasLayer(meta.groupLayer)) {
                        loadLayer(meta).catch(function(err) {
                            console.error("Year choropleth load failed:", meta.id, err);
                        });
                    } else {
                        detachYearLayers(meta);
                    }
                });
            }
            function syncYearButtons(yearId) {
                Array.prototype.slice.call(document.querySelectorAll(".edwa-year-btn")).forEach(function(button) {
                    button.classList.toggle("edwa-active", button.dataset.yearId === yearId);
                });
            }
            function setYear(yearId) {
                if (!yearId || window.edwaOriginActiveYear === yearId) return;
                window.edwaOriginActiveYear = yearId;
                syncYearButtons(yearId);
                refreshVisibleLayers();
            }
            function overlayInputs(section) {
                return Array.prototype.slice.call(
                    section.querySelectorAll("input.leaflet-control-layers-selector")
                ).filter(function(input) {
                    return input.layerId !== undefined;
                });
            }
            function installPanel() {
                if (document.getElementById("edwa-year-toggle")) return;
                var list = document.querySelector(".leaflet-control-layers-list");
                var section = document.querySelector(".leaflet-control-layers-overlays");
                if (!list || !section) return;

                var wrap = document.createElement("div");
                wrap.className = "edwa-origin-year-wrap";
                wrap.innerHTML = ''
                    + '<span class="edwa-panel-section-title">Year</span>'
                    + '<div class="edwa-year-toggle" id="edwa-year-toggle"></div>'
                    + '<div class="edwa-layer-bulk-actions">'
                    + '<button type="button" class="edwa-layer-bulk-btn" id="edwa-layer-select-all">Select all</button>'
                    + '<button type="button" class="edwa-layer-bulk-btn" id="edwa-layer-clear-all">Clear all</button>'
                    + '</div>';
                list.insertBefore(wrap, section);

                var yearToggle = document.getElementById("edwa-year-toggle");
                years.forEach(function(year) {
                    var button = document.createElement("button");
                    button.type = "button";
                    button.className = "edwa-year-btn" + (year.id === activeYear() ? " edwa-active" : "");
                    button.dataset.yearId = year.id;
                    button.textContent = year.label;
                    button.addEventListener("click", function() {
                        setYear(year.id);
                    });
                    yearToggle.appendChild(button);
                });

                var selectAllBtn = document.getElementById("edwa-layer-select-all");
                var clearAllBtn = document.getElementById("edwa-layer-clear-all");
                function setInputsChecked(inputs, on) {
                    inputs.forEach(function(input) {
                        if (input.checked !== on) input.click();
                    });
                }
                selectAllBtn.addEventListener("click", function(ev) {
                    ev.preventDefault();
                    setInputsChecked(overlayInputs(section), true);
                });
                clearAllBtn.addEventListener("click", function(ev) {
                    ev.preventDefault();
                    setInputsChecked(overlayInputs(section).filter(function(input) { return input.checked; }), false);
                });
                syncYearButtons(activeYear());
            }

            window.edwaOriginActiveYear = window.edwaOriginActiveYear || defaultYear;
            window.edwaOriginSetYear = setYear;
            layers.forEach(function(meta) {
                meta.groupLayer = window[meta.groupVar];
            });
            mapRef.on("overlayadd", function(e) {
                var meta = layers.find(function(m) { return m.groupLayer === e.layer; });
                if (!meta) return;
                loadLayer(meta).catch(function(err) {
                    console.error("Year choropleth load failed:", meta.id, err);
                });
            });
            mapRef.on("overlayremove", function(e) {
                var meta = layers.find(function(m) { return m.groupLayer === e.layer; });
                if (!meta) return;
                detachYearLayers(meta);
            });
            document.addEventListener("DOMContentLoaded", function() {
                installPanel();
                setTimeout(installPanel, 300);
                setTimeout(installPanel, 800);
            });
            mapRef.whenReady(function() {
                installPanel();
                syncYearButtons(activeYear());
                refreshVisibleLayers();
            });
        })();
        
</script>
</html>
